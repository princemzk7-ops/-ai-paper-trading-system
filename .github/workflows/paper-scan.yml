
name: Bybit Paper Trading Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: bybit-paper-bot
  cancel-in-progress: false

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get Bot Files
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy pandas

      - name: Start Paper Trading Bot
        run: |
          python paper_bot.py 
